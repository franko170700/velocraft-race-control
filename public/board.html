<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VeloCraft — General Classification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="board-body">
  <div class="board-head">
    <div class="logo">VeloCraft</div>
    <div>
      <div style="font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:2px;">GENERAL CLASSIFICATION</div>
      <div style="color:#c7ced9;letter-spacing:3px;text-transform:uppercase;font-size:13px;">SAP S/4HANA Race · Accenture Graduates</div>
    </div>
    <div class="board-clock" id="clockWrap">
      <div class="time" id="clock">--:--</div>
      <div class="state" id="clockState">Not started</div>
    </div>
  </div>

  <div class="board-main">
    <div class="gc" id="gc"></div>
    <div class="radio">
      <h2>📻 Race Radio</h2>
      <div id="radio"></div>
    </div>
  </div>

  <script src="/js/board.js"></script>
</body>
</html>
